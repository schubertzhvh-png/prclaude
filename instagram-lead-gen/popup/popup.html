<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram Lead Gen</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header>
      <h1>📊 Instagram Lead Gen</h1>
      <div id="stats" class="stats">
        <div class="stat-item">
          <span class="stat-label">Leads:</span>
          <span id="totalLeads" class="stat-value">0</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Sent Today:</span>
          <span id="sentToday" class="stat-value">0</span>
        </div>
      </div>
    </header>

    <!-- Tabs -->
    <nav class="tabs">
      <button class="tab-btn active" data-tab="scraper">Scraper</button>
      <button class="tab-btn" data-tab="leads">Leads</button>
      <button class="tab-btn" data-tab="campaigns">Campaigns</button>
      <button class="tab-btn" data-tab="settings">Settings</button>
    </nav>

    <!-- Tab: Scraper -->
    <div id="scraper" class="tab-content active">
      <h2>🔍 Scrape Leads</h2>

      <div class="form-group">
        <label for="scrapeType">Scrape Type:</label>
        <select id="scrapeType">
          <option value="followers">Followers</option>
          <option value="following">Following</option>
          <option value="post_likes">Post Likes</option>
          <option value="hashtag">Hashtag</option>
        </select>
      </div>

      <div class="form-group">
        <label for="scrapeTarget">Username or URL:</label>
        <input type="text" id="scrapeTarget" placeholder="username or paste URL">
      </div>

      <div class="filters">
        <h3>Filters</h3>
        <div class="form-group">
          <label for="minFollowers">Min Followers:</label>
          <input type="number" id="minFollowers" value="100" min="0">
        </div>
        <div class="form-group">
          <label for="maxFollowers">Max Followers:</label>
          <input type="number" id="maxFollowers" value="10000" min="0">
        </div>
        <div class="form-group checkbox">
          <input type="checkbox" id="onlyPublic" checked>
          <label for="onlyPublic">Only public accounts</label>
        </div>
        <div class="form-group checkbox">
          <input type="checkbox" id="requireBio">
          <label for="requireBio">Require bio</label>
        </div>
        <div class="form-group">
          <label for="keywords">Keywords (comma separated):</label>
          <input type="text" id="keywords" placeholder="entrepreneur, business, founder">
        </div>
      </div>

      <button id="startScrape" class="btn btn-primary">Start Scraping</button>
      <button id="stopScrape" class="btn btn-secondary" style="display:none;">Stop</button>

      <div id="scrapeProgress" class="progress-box" style="display:none;">
        <div class="progress-text">Scraping: <span id="scrapedCount">0</span> leads</div>
        <div class="progress-bar">
          <div id="progressBar" class="progress-fill"></div>
        </div>
      </div>
    </div>

    <!-- Tab: Leads -->
    <div id="leads" class="tab-content">
      <h2>👥 Leads Database</h2>

      <div class="form-group">
        <input type="text" id="searchLeads" placeholder="Search leads...">
      </div>

      <div class="leads-actions">
        <button id="exportLeads" class="btn btn-secondary">Export CSV</button>
        <button id="clearLeads" class="btn btn-danger">Clear All</button>
      </div>

      <div id="leadsList" class="leads-list">
        <!-- Dynamically filled -->
      </div>
    </div>

    <!-- Tab: Campaigns -->
    <div id="campaigns" class="tab-content">
      <h2>📢 Message Campaigns</h2>

      <button id="createCampaign" class="btn btn-primary">+ New Campaign</button>

      <div id="campaignsList" class="campaigns-list">
        <!-- Dynamically filled -->
      </div>

      <!-- Campaign Creator Modal -->
      <div id="campaignModal" class="modal" style="display:none;">
        <div class="modal-content">
          <h3>Create Campaign</h3>

          <div class="form-group">
            <label for="campaignName">Campaign Name:</label>
            <input type="text" id="campaignName" placeholder="My Campaign">
          </div>

          <div class="form-group">
            <label for="targetSelection">Target Leads:</label>
            <select id="targetSelection">
              <option value="all">All Leads</option>
              <option value="tags">By Tags</option>
              <option value="manual">Manual Selection</option>
            </select>
          </div>

          <div class="form-group" id="tagsInput" style="display:none;">
            <label for="targetTags">Tags (comma separated):</label>
            <input type="text" id="targetTags" placeholder="followers, hashtag">
          </div>

          <div class="form-group">
            <label>Message Sequence:</label>
            <div id="messageSequence">
              <div class="message-step">
                <textarea class="message-template" placeholder="Message 1: {firstName}, hey! I saw your profile..."></textarea>
                <input type="number" class="message-delay" value="0" min="0" placeholder="Delay (hours)">
              </div>
            </div>
            <button id="addMessageStep" class="btn btn-secondary">+ Add Step</button>
          </div>

          <div class="form-group checkbox">
            <input type="checkbox" id="useAI">
            <label for="useAI">Generate with AI</label>
          </div>

          <div class="modal-actions">
            <button id="saveCampaign" class="btn btn-primary">Create Campaign</button>
            <button id="cancelCampaign" class="btn btn-secondary">Cancel</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Tab: Settings -->
    <div id="settings" class="tab-content">
      <h2>⚙️ Settings</h2>

      <div class="form-group">
        <label for="messagesPerHour">Messages per hour:</label>
        <input type="number" id="messagesPerHour" value="15" min="1" max="50">
      </div>

      <div class="form-group">
        <label for="messagesPerDay">Messages per day:</label>
        <input type="number" id="messagesPerDay" value="80" min="1" max="200">
      </div>

      <div class="form-group">
        <label for="startTime">Start time:</label>
        <input type="time" id="startTime" value="09:00">
      </div>

      <div class="form-group">
        <label for="endTime">End time:</label>
        <input type="time" id="endTime" value="21:00">
      </div>

      <div class="form-group checkbox">
        <input type="checkbox" id="stopOnReply" checked>
        <label for="stopOnReply">Stop sequence on reply</label>
      </div>

      <div class="form-group">
        <label for="openaiKey">OpenAI API Key (for AI generation):</label>
        <input type="password" id="openaiKey" placeholder="sk-...">
        <small>Get your API key from <a href="https://platform.openai.com/api-keys" target="_blank">OpenAI</a></small>
      </div>

      <button id="saveSettings" class="btn btn-primary">Save Settings</button>

      <hr>

      <h3>Data Management</h3>
      <button id="exportData" class="btn btn-secondary">Export All Data</button>
      <button id="importData" class="btn btn-secondary">Import Data</button>
      <input type="file" id="importFile" style="display:none;" accept=".json">
    </div>
  </div>

  <script src="../utils/storage.js"></script>
  <script src="../utils/ai.js"></script>
  <script src="popup.js"></script>
</body>
</html>
